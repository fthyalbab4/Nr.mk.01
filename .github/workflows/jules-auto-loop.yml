name: Autonomous Jules Execution Loop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check if Project is 100% Completed
        id: check_todo
        run: |
          if grep -q "\[ \]" TODO.md; then
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "يوجد مهام متبقية..."
          else
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "المشروع مكتمل 100%."
          fi

      - name: Trigger Jules via REST API
        if: steps.check_todo.outputs.has_tasks == 'true'
        run: |
          curl -X POST "https://jules.googleapis.com/v1alpha/tasks" \
            -H "Authorization: Bearer ${{ secrets.JULES_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "prompt": "اقرأ ملف TODO.md ونفذ أول مهمة غير مكتملة [ ]، ثم حدّث الملف إلى [x] واعمل Push إلى main."
            }'
