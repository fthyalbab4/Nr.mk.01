name: Autonomous Jules Execution Loop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check if Project is 100% Completed
        id: check_todo
        run: |
          if grep -q "\[ \]" TODO.md; then
            echo "has_tasks=true" >> $GITHUB_OUTPUT
            echo "يوجد مهام متبقية، سيتم تشغيل Jules..."
          else
            echo "has_tasks=false" >> $GITHUB_OUTPUT
            echo "مبروك! تم إنجاز جميع المهام والمشروع مكتمل 100%."
          fi

      - name: Run Jules for Next Unfinished Task
        if: steps.check_todo.outputs.has_tasks == 'true'
        uses: google-labs-code/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            قم بقراءة ملف TODO.md.
            اختر أول مهمة غير مكتملة تحتوي على [ ].
            قم بتنفيذ الكود المطلوب لها بالكامل داخل المشروع.
            بعد الانتهاء، قم بتحديث القائمة في TODO.md وتغيير المربع إلى [x].
            اعمل Commit و Push التعديلات مباشرة إلى فرع main.
